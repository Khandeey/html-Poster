<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Motivation Poster</title>
  <style>
    body {
      background-color: black;
    }
    .abril-fatface-regular {
      font-family: "Abril Fatface", serif;
      font-weight: 400;
      font-style: normal;
      color: white;
      text-align: center;
    }

    .poster {
      width: 70%;
      margin-left: 15%;
      margin-bottom: 50px;
      color: white;
      text-align: center;
    }
    .pic {
      width: 100%;
      height: 150px;
      border: solid white 5px;
      margin-bottom: 0px;
      
    }
    p {
      margin-top: 0px;
    }
    h2 {
      margin: 0px;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Gravitas+One&family=Lexend+Zetta:wght@100..900&family=Oswald:wght@200..700&family=Vina+Sans&display=swap" rel="stylesheet">
</head>
<body>
  <h1 class="abril-fatface-regular">Motivational Posters</h1>
  <div class="poster">
    <img class="pic" src="./2769aec3b16c4ec1e0e0da20f2771cee.jpg" alt="poster pic" />
    <h2>PETER DRUCKER</h2>
    <p>"The best way to predict future is to create it"</p>
  </div>
  <div class="poster">
    <img class="pic" src="./8a1a62717c1a65ccbdf9b97b8484b41e.jpg" alt="poster pic" />
    <h2>SIMON SINEK</h2>
    <p>"Dream big. Start small. But most of all, start."</p>
  </div>
  <div class="poster">
    <img class="pic" src="./946bf410fe4c471ae10a4c103e2320ae.jpg" alt="poster pic" />
    <h2>ABRAHAM LINCOLN</h2>
    <p>"Discipline is choosing between what you want now and what you want most."</p>
  </div>
  
</body>
</html>
